# XcodeGen spec — generate the Xcode project with:  xcodegen generate
# (run from the ios/ directory). The .xcodeproj IS committed so CI and Xcode
# Cloud can build without running XcodeGen first — regenerate and commit it
# after editing this file.

name: AIUsageLimits

options:
  bundleIdPrefix: com.stavrop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: NCZ7646BF7
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  AIUsageLimits:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stavrop.ailimits
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AIUsageLimits.entitlements
    dependencies:
      - target: UsageWidgetExtension
        embed: true

  UsageWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stavrop.ailimits.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Usage Limits
        CODE_SIGN_ENTITLEMENTS: Widget/UsageWidget.entitlements

# A SHARED scheme (committed in xcshareddata) — required by Xcode Cloud.
schemes:
  AIUsageLimits:
    build:
      targets:
        AIUsageLimits: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
