name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: |
        **Requesting a new provider?** It needs a way to sign in that works on a
        phone and an endpoint that reports usage or quota. If you know of one,
        please link it — that's the hard part.
